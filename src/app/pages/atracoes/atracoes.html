<div class="atracoes-container">
  <div class="page-header">
    <h1 class="page-title">Atrações</h1>
    <button class="btn-primary">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nova Atração
    </button>
  </div>

  <div class="filters">
    <button class="filter-btn" [class.active]="filtroAtivo === 'todos'" (click)="setFiltro('todos')">Todos</button>
    <button class="filter-btn" [class.active]="filtroAtivo === 'filme'" (click)="setFiltro('filme')">Filmes</button>
    <button class="filter-btn" [class.active]="filtroAtivo === 'show'" (click)="setFiltro('show')">Shows</button>
  </div>

  <div class="atracoes-grid">
    @for (atracao of atracoesFiltradas(); track atracao.id) {
      <div class="atracao-card">
        <div class="card-image">
          <img [src]="atracao.imagem" [alt]="atracao.nome" />
          <span class="badge" [class]="'badge-' + atracao.tipo">{{ atracao.tipoLabel }}</span>
        </div>
        <div class="card-body">
          <h3 class="card-title">{{ atracao.nome }}</h3>
          <p class="card-genero">{{ atracao.genero }}</p>
          <p class="card-desc">{{ atracao.descricao }}</p>
          <div class="card-info">
            <div class="info-item">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span>{{ atracao.duracao }} min</span>
            </div>
            <div class="info-item">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span>{{ atracao.totalEventos }} eventos realizados</span>
            </div>
          </div>
          <div class="card-footer">
            <div class="card-actions">
              <button class="action-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button class="action-btn action-danger">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
              </button>
            </div>
            <button class="btn-outline">Agendar evento</button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
